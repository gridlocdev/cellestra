appId: dev.gridloc.cellestra
productName: Cellestra
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # The window icon on Linux and Windows (macOS takes the bundle's icon.icns).
  - build/icon.png
asar: true
fileAssociations:
  - ext: ods
    name: OpenDocument Spreadsheet
    mimeType: application/vnd.oasis.opendocument.spreadsheet
    role: Editor
  - ext: csv
    name: CSV Document
    mimeType: text/csv
    role: Editor
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature, so Apple silicon will run a local build. Swap for a Developer ID to distribute.
  identity: '-'
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Office
win:
  icon: build/icon.ico
  target: [nsis]
