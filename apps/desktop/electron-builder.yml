appId: dev.gridloc.cellestra
productName: Cellestra
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # The window icon on Linux and Windows (macOS takes the bundle's icon.icns).
  - build/icon.png
asar: true
# Electron's build-time switches, flipped before signing. The app never runs as plain Node, takes no
# NODE_OPTIONS or --inspect flags, and loads only its own checked app.asar, so no other program can
# reuse the signed binary as a Node runtime or point it at other code.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# One naming scheme on every system: Cellestra-0.1.0-mac-arm64.dmg, Cellestra-0.1.0-win-x64.exe, …
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
fileAssociations:
  - ext: ods
    name: OpenDocument Spreadsheet
    mimeType: application/vnd.oasis.opendocument.spreadsheet
    role: Editor
  - ext: csv
    name: CSV Document
    mimeType: text/csv
    role: Editor
  # Opened as a new .ods; Cellestra never writes .xlsx.
  - ext: xlsx
    name: Excel Workbook
    mimeType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    role: Viewer
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature, so Apple silicon will run a local build. Swap for a Developer ID to distribute.
  identity: '-'
linux:
  icon: build/icon.png
  target: [AppImage]
  # The package name (@cellestra/desktop) isn't a usable file name.
  executableName: cellestra
  category: Office
win:
  icon: build/icon.ico
  target: [nsis]
