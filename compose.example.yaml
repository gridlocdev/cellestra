# Copy to compose.yaml on the NAS and adjust the volume paths.
services:
  cellestra:
    build: .
    # image: cellestra:latest
    ports:
      - '8787:8787'
    environment:
      # One or more folders, Name=/container/path;Other=/container/path2
      CELLESTRA_ROOTS: 'Documents=/data/documents;Shared=/data/shared'
      # Shared secret the browser asks for. Required: the server will not start without it.
      CELLESTRA_TOKEN: change-me-to-a-long-random-secret
      # Only if your NAS reverse proxy already requires a login, drop the token and set:
      # CELLESTRA_NO_AUTH: '1'
      # Without a token, only IP addresses and localhost are answered. Add the names you browse to:
      # CELLESTRA_HOSTS: 'nas.lan,cellestra.home.arpa'
    volumes:
      - /volume1/documents:/data/documents
      - /volume1/shared:/data/shared
    # The container runs as the image's `node` user (uid 1000); match your NAS share's owner:
    # user: '1026:100'
    restart: unless-stopped
